<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Оффлайн — Моя система</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0;
    font-family: system-ui, sans-serif; }
  .card { text-align: center; padding: 40px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: #64748b; font-size: 14px; max-width: 320px; margin: 0 auto 20px; }
  a { color: #67e8f9; text-decoration: none; border: 1px solid rgba(103,232,249,.4); padding: 10px 22px; border-radius: 999px; font-size: 14px; }
  .dot { width: 64px; height: 64px; margin: 0 auto; border-radius: 20px;
    background: linear-gradient(135deg, rgba(34,211,238,.25), rgba(129,140,248,.25));
    display: grid; place-items: center; font-size: 28px; color: #67e8f9; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">⌁</div>
    <h1>Нет соединения</h1>
    <p>Моя система недоступна оффлайн. Проверьте сеть — данные синхронизируются автоматически.</p>
    <a href="/">Повторить</a>
  </div>
</body>
</html>
